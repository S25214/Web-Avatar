<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAvatar — Fullscreen Live Mode</title>
    <meta name="description" content="Fullscreen AI avatar voice experience powered by Gemini Live.">
    <style>
        /* Minimal host page styles — fullscreen module takes over everything */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0f; }
    </style>
</head>
<body>

    <!--
        Fullscreen mode configuration:
          data-mode="fullscreen"        ← enables the Gemini Live fullscreen provider
          data-widget-id="..."          ← your widget ID for token + config fetch
          data-avatar-url="Botnoi"      ← VRM model name or URL
    -->
    <script
        type="module"
        src="./chat-widget.js"
        data-mode="realtime-fullscreen"
        data-widget-id="demo-widget-001"
        data-avatar-url="Kitagawa"
        data-avatar-widget-src="./avatar-widget.js"
    ></script>

</body>
</html>
