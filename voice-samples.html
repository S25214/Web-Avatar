<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Samples</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --card:#1d2025; --text:#e8eaed; --muted:#9aa0a6; --line:#2c3036; --accent:#818cf8; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 20px 48px; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:960px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { margin:0 0 20px; color:var(--muted); }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .filters button { border:1px solid var(--line); background:var(--card); color:var(--text); padding:6px 12px; border-radius:999px; font:inherit; cursor:pointer; }
  .filters button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card.playing { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .play { flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; display:grid; place-items:center; }
  .play:hover { filter:brightness(1.1); }
  .title { font-weight:600; }
  .meta { color:var(--muted); font-size:13px; }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .info { flex:1; min-width:0; }
  .err { color:#dc2626; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Voice Samples</h1>
  <p class="sub">Click a voice to listen. Only one plays at a time.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const BASE = "https://gstatic.com/aistudio/voices/samples/";

// [sample file, pitch, style, gender] — same links as the frontend widget-manage list
const VOICES = [
  ["Zephyr","Higher","Bright","Female"], ["Puck","Middle","Upbeat","Male"], ["Charon","Lower","Informative","Male"],
  ["Kore","Middle","Firm","Female"], ["Fenrir","Lower middle","Excitable","Male"], ["Leda","Higher","Youthful","Female"],
  ["Orus","Lower middle","Firm","Male"], ["Aoede","Middle","Breezy","Female"], ["Callirrhoe","Middle","Easy-going","Female"],
  ["Autonoe","Middle","Bright","Female"], ["Enceladus","Lower","Breathy","Male"], ["Iapetus","Lower middle","Clear","Male"],
  ["Umbriel","Lower middle","Easy-going","Male"], ["Algieba","Lower","Smooth","Male"], ["Despina","Middle","Smooth","Female"],
  ["Erinome","Middle","Clear","Female"], ["Algenib","Lower","Gravelly","Male"], ["Rasalgethi","Middle","Informative","Male"],
  ["Laomedeia","Higher","Upbeat","Female"], ["Achernar","Higher","Soft","Female"], ["Alnilam","Lower middle","Firm","Male"],
  ["Schedar","Lower middle","Even","Male"], ["Gacrux","Middle","Mature","Female"], ["Pulcherrima","Middle","Forward","Female"],
  ["Achird","Lower middle","Friendly","Male"], ["Zubenelgenubi","Lower middle","Casual","Male"],
].map(([file, pitch, style, gender], i) => ({ n: i + 1, url: `${BASE}${file}.wav`, pitch, style, gender }));

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const audio = new Audio();
audio.preload = "none";
let current = null; // { card, btn, bar }

function stop() {
  audio.pause();
  if (current) {
    current.card.classList.remove("playing");
    current.btn.textContent = "▶";
    current.bar.style.width = "0";
    current = null;
  }
}

audio.addEventListener("ended", stop);
audio.addEventListener("timeupdate", () => {
  if (current && audio.duration) current.bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
});
audio.addEventListener("error", () => {
  if (!current) return;
  const msg = current.card.querySelector(".meta");
  const old = msg.textContent;
  msg.innerHTML = '<span class="err">Could not load sample</span>';
  setTimeout(() => (msg.textContent = old), 2500);
  stop();
});

function render() {
  grid.innerHTML = "";
  stop();
  VOICES.filter(v => (gender === "All" || v.gender === gender) && (pitch === "All" || v.pitch === pitch)).forEach(v => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <button class="play" aria-label="Play voice ${v.n}">▶</button>
      <div class="info">
        <div class="title">Voice ${v.n} · ${v.style}</div>
        <div class="meta">${v.gender} · ${v.pitch} pitch</div>
        <div class="bar"><i></i></div>
      </div>`;
    const btn = card.querySelector(".play");
    const bar = card.querySelector(".bar i");
    btn.addEventListener("click", () => {
      if (current && current.btn === btn) return stop();
      stop();
      current = { card, btn, bar };
      card.classList.add("playing");
      btn.textContent = "❚❚";
      audio.src = v.url;
      audio.play().catch(() => {});
    });
    grid.appendChild(card);
  });
}

let gender = "All", pitch = "All";
function chips(values, label, onPick) {
  const row = document.createElement("div");
  row.className = "filters";
  values.forEach((val, idx) => {
    const b = document.createElement("button");
    b.textContent = val === "All" ? "All" : label(val);
    b.className = idx === 0 ? "on" : "";
    b.addEventListener("click", () => {
      [...row.children].forEach(c => c.classList.toggle("on", c === b));
      onPick(val);
      render();
    });
    row.appendChild(b);
  });
  return row;
}
const bar = document.getElementById("filters");
bar.className = "";
bar.append(
  chips(["All", "Female", "Male"], g => g, v => (gender = v)),
  chips(["All", ...new Set(VOICES.map(v => v.pitch))], p => p + " pitch", v => (pitch = v))
);
render();
</script>
</body>
</html>
