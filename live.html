<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAvatar — Fullscreen Live Voice Experience</title>
    <meta name="description" content="Fullscreen AI avatar voice experience powered by Gemini Live.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            touch-action: pan-y;
        }
        
        body {
            background-color: #050508;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f1f1f6;
            width: 100%;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            touch-action: pan-y;
        }

        /* Ambient glowing backgrounds for premium feel */
        .bg-glow {
            position: fixed;
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.04) 50%, transparent 100%);
            top: -15vw;
            left: -15vw;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 15s infinite alternate;
        }

        .bg-glow-right {
            position: fixed;
            width: 50vw;
            height: 50vw;
            max-width: 500px;
            max-height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(236, 72, 153, 0.02) 60%, transparent 100%);
            bottom: -10vw;
            right: -10vw;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow-right 12s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(50px, 50px); }
        }

        @keyframes pulse-glow-right {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-30px, -30px); }
        }

        /* Glassmorphic Container */
        .config-container {
            position: relative;
            z-index: 10;
            width: calc(100% - 32px);
            max-width: 480px;
            margin: 16px;
            padding: 40px;
            background: rgba(13, 13, 22, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .config-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .config-container.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* Typography */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            position: relative;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            z-index: -1;
            opacity: 0.5;
            filter: blur(6px);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 30%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px; /* 16px prevents iOS auto-zoom on input focus */
            font-family: inherit;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none; /* Remove iOS default input styling */
        }

        .form-input::placeholder {
            color: #475569;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Button styling */
        .btn-launch {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-launch::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            background: linear-gradient(135deg, #4f46e5, #9333ea);
        }

        .btn-launch:hover::before {
            left: 100%;
        }

        .btn-launch:active {
            transform: translateY(1px);
        }

        /* Status & Error Display */
        .error-message {
            color: #f43f5e;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        /* Hide elements when active */
        .hidden {
            display: none !important;
        }

        /* Subtle footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
        }

        /* Mobile responsive */
        @media (max-width: 520px) {
            .config-container {
                padding: 28px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .header {
                margin-bottom: 24px;
            }

            .logo-icon {
                width: 48px;
                height: 48px;
                border-radius: 14px;
            }

            .logo-icon svg {
                width: 24px;
                height: 24px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .btn-launch {
                padding: 14px;
                font-size: 15px;
            }
        }

        /* Top Right Hamburger Button & Settings Panel */
        .hamburger-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(13, 13, 22, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .hamburger-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .hamburger-btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .hamburger-btn.active svg {
            transform: rotate(90deg);
        }

        .settings-panel {
            position: fixed;
            top: 74px;
            right: 20px;
            z-index: 9999;
            width: 320px;
            padding: 24px;
            background: rgba(13, 13, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .settings-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        /* Toggle Switches */
        .switch-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch-label {
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.15);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-color: transparent;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <!-- Ambient glowing backgrounds -->
    <div id="bg-glow-left" class="bg-glow"></div>
    <div id="bg-glow-right" class="bg-glow-right"></div>

    <!-- Main Config Card -->
    <div id="config-card" class="config-container">
        <div class="header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </div>
            <h1>WebAvatar Live</h1>
            <p class="subtitle">Enter parameters to initialize the voice experience</p>
        </div>

        <form id="config-form" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label class="form-label" for="widget-id">Widget ID</label>
                <div class="input-wrapper">
                    <input type="text" id="widget-id" class="form-input" placeholder="e.g. 65c92842..." required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="avatar-url">Avatar URL or ID (VRM)</label>
                <div class="input-wrapper">
                    <input type="text" id="avatar-url" class="form-input" placeholder="e.g. https://domain.com/avatar.vrm or custom-id" required>
                </div>
            </div>

            <button type="submit" class="btn-launch">
                <span>Start Experience</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
            
            <div id="validation-error" class="error-message">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-text">Please fill out all fields.</span>
            </div>
        </form>

        <div class="footer">
            WebAvatar © 2026. All rights reserved.
        </div>
    </div>

    <!-- Top Right Collapsible Hamburger Settings Panel -->
    <button id="hamburger-btn" class="hamburger-btn hidden" onclick="toggleSettingsPanel()" title="Settings">
        <svg id="hamburger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div id="settings-panel" class="settings-panel">
        <div class="panel-header">
            <div class="panel-title">Widget Configuration</div>
        </div>

        <div class="panel-body">
            <!-- Greeting Instruction Toggle & Input -->
            <div class="form-group" style="margin-bottom: 20px;">
                <div class="switch-group">
                    <span class="switch-label">Greeting Instruction</span>
                    <label class="switch">
                        <input type="checkbox" id="greeting-toggle" checked onchange="handleGreetingToggleChange()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div id="greeting-input-container" class="input-wrapper" style="margin-top: 12px;">
                    <input type="text" id="greeting-instruction" class="form-input" value="Greet the user." placeholder="Enter greeting instruction..." onfocus="handleGreetingFocus(this)" onblur="handleGreetingBlur(this)">
                </div>
            </div>

            <!-- Enable Bubble Toggle -->
            <div class="form-group" style="margin-bottom: 8px;">
                <div class="switch-group">
                    <span class="switch-label">Enable Bubble</span>
                    <label class="switch">
                        <input type="checkbox" id="bubble-toggle" checked onchange="handleBubbleToggleChange()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check URL parameters
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                avatar: params.get('avatar'),
                greetingInstruction: params.get('greetingInstruction'),
                enableBubble: params.get('enableBubble')
            };
        }

        // Apply parameters to inputs if present
        const queryParams = getQueryParams();
        const widgetIdInput = document.getElementById('widget-id');
        const avatarUrlInput = document.getElementById('avatar-url');

        if (queryParams.id) widgetIdInput.value = queryParams.id;
        if (queryParams.avatar) avatarUrlInput.value = queryParams.avatar;

        const greetingToggle = document.getElementById('greeting-toggle');
        const greetingInput = document.getElementById('greeting-instruction');
        const greetingContainer = document.getElementById('greeting-input-container');
        const bubbleToggle = document.getElementById('bubble-toggle');

        if (queryParams.greetingInstruction !== null) {
            if (queryParams.greetingInstruction === 'false') {
                greetingToggle.checked = false;
                greetingContainer.style.display = 'none';
            } else {
                greetingToggle.checked = true;
                greetingInput.value = queryParams.greetingInstruction;
                greetingContainer.style.display = 'block';
            }
        }

        if (queryParams.enableBubble !== null) {
            bubbleToggle.checked = (queryParams.enableBubble !== 'false');
        }

        // Determine if we should show the form or load the script directly
        const hasId = !!queryParams.id;
        const hasAvatar = !!queryParams.avatar;

        if (hasId && hasAvatar) {
            // Load script immediately
            loadWidgetScript(queryParams.id, queryParams.avatar);
        } else {
            // Show config form with entry animation
            const configCard = document.getElementById('config-card');
            // Allow DOM to register default state, then animate
            setTimeout(() => {
                configCard.classList.add('show');
            }, 50);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const widgetId = widgetIdInput.value.trim();
            const avatarUrl = avatarUrlInput.value.trim();
            const errorDiv = document.getElementById('validation-error');
            const errorText = document.getElementById('error-text');

            if (!widgetId || !avatarUrl) {
                errorText.innerText = "Both fields are required.";
                errorDiv.style.display = 'flex';
                return;
            }

            errorDiv.style.display = 'none';

            // Update URL parameters without page reload
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('id', widgetId);
            newUrl.searchParams.set('avatar', avatarUrl);

            const configValues = getWidgetConfigValues();
            if (configValues.greetingInstruction === false) {
                newUrl.searchParams.set('greetingInstruction', 'false');
            } else {
                newUrl.searchParams.set('greetingInstruction', configValues.greetingInstruction);
            }
            newUrl.searchParams.set('enableBubble', configValues.enableBubble ? 'true' : 'false');

            window.history.pushState({ path: newUrl.href }, '', newUrl.href);

            // Animate card fading out
            const configCard = document.getElementById('config-card');
            configCard.classList.add('fade-out');

            setTimeout(() => {
                configCard.classList.add('hidden');
                // Fade out backgrounds as well
                document.getElementById('bg-glow-left').classList.add('hidden');
                document.getElementById('bg-glow-right').classList.add('hidden');
                
                // Launch script
                loadWidgetScript(widgetId, avatarUrl);
            }, 600);
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settings-panel');
            const btn = document.getElementById('hamburger-btn');
            panel.classList.toggle('open');
            btn.classList.toggle('active');
        }

        let previousGreetingValue = "";
        function handleGreetingFocus(input) {
            previousGreetingValue = input.value.trim();
        }

        function handleGreetingBlur(input) {
            const currentValue = input.value.trim();
            if (currentValue !== previousGreetingValue) {
                reloadWidgetAndUrl();
            }
        }

        function handleGreetingToggleChange() {
            const greetingToggle = document.getElementById('greeting-toggle');
            const greetingContainer = document.getElementById('greeting-input-container');
            if (greetingToggle.checked) {
                greetingContainer.style.display = 'block';
            } else {
                greetingContainer.style.display = 'none';
            }
            reloadWidgetAndUrl();
        }

        function handleBubbleToggleChange() {
            reloadWidgetAndUrl();
        }

        function getWidgetConfigValues() {
            const greetingToggle = document.getElementById('greeting-toggle');
            const greetingInput = document.getElementById('greeting-instruction');
            const bubbleToggle = document.getElementById('bubble-toggle');

            let greetingInstruction = false;
            if (greetingToggle.checked) {
                greetingInstruction = greetingInput.value.trim() || "Greet the user.";
            }

            return {
                greetingInstruction: greetingInstruction,
                enableBubble: bubbleToggle.checked
            };
        }

        function reloadWidgetAndUrl() {
            const configValues = getWidgetConfigValues();
            const newUrl = new URL(window.location.href);
            
            const widgetId = widgetIdInput ? widgetIdInput.value.trim() : (queryParams.id || '');
            const avatarUrl = avatarUrlInput ? avatarUrlInput.value.trim() : (queryParams.avatar || '');

            if (widgetId) newUrl.searchParams.set('id', widgetId);
            if (avatarUrl) newUrl.searchParams.set('avatar', avatarUrl);

            if (configValues.greetingInstruction === false) {
                newUrl.searchParams.set('greetingInstruction', 'false');
            } else {
                newUrl.searchParams.set('greetingInstruction', configValues.greetingInstruction);
            }

            newUrl.searchParams.set('enableBubble', configValues.enableBubble ? 'true' : 'false');

            window.location.href = newUrl.href;
        }

        function loadWidgetScript(widgetId, avatarUrl) {
            // Show hamburger button
            const hamburgerBtn = document.getElementById('hamburger-btn');
            if (hamburgerBtn) hamburgerBtn.classList.remove('hidden');

            const configValues = getWidgetConfigValues();

            // Configure the widget
            window.ChatWidgetConfig = {
                mode: "realtime-fullscreen",
                widgetId: widgetId,
                avatarUrl: avatarUrl,
                greetingInstruction: configValues.greetingInstruction,
                enableBubble: configValues.enableBubble,
            };

            // Dynamic script loading
            if (document.getElementById('webavatar-jssdk')) return;
            const s = document.createElement('script');
            s.id = 'webavatar-jssdk';
            s.src = './chat-widget.js';
            s.async = true;
            (document.head || document.body).appendChild(s);
        }
    </script>
</body>
</html>
