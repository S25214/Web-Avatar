<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebAvatar Chat Widget</title>
</head>

<body>

    <!--
    ╔══════════════════════════════════════════════════════════════════╗
    ║  WebAvatar Chat Widget — Universal Embed Snippet               ║
    ╠══════════════════════════════════════════════════════════════════╣
    ║                                                                ║
    ║  Copy the <script> block below and paste it into your page.    ║
    ║  Works on ANY framework: HTML, React, Vue, Angular, Next.js.   ║
    ║                                                                ║
    ║  For React/Vue/Angular, paste the JavaScript INSIDE the        ║
    ║  <script> tag into your component's mount lifecycle:            ║
    ║    • React:   useEffect(() => { ... }, [])                     ║
    ║    • Vue:     onMounted(() => { ... })                         ║
    ║    • Angular: ngAfterViewInit() { ... }                        ║
    ║    • Svelte:  onMount(() => { ... })                           ║
    ║  The code is identical — no translation needed.                ║
    ║                                                                ║
    ║  CONFIGURATION:                                                ║
    ║    botId       (required) Your Botnoi Bot ID                   ║
    ║    title       Chat window display name                        ║
    ║    avatarUrl   3D avatar model: "Botnoi", "Kitagawa", etc.     ║
    ║    bnvVersion  Voice version: "1" or "2"                       ║
    ║    bnvSpeaker  Speaker ID (default: "13")                      ║
    ║    avatar      Set to "false" to disable 3D avatar             ║
    ║    color       Theme color hex, e.g. "#a7e6ff"                 ║
    ║                                                                ║
    ╚══════════════════════════════════════════════════════════════════╝
    -->

    <script>
        window.ChatWidgetConfig = {
            botId: "64464df59f76af17c9ca0ed3",
            title: "botnoidemoagent",
            avatarUrl: "Kitagawa",
            bnvVersion: "1",
            bnvSpeaker: "2",
            color:"#01bffb"
        };
        (function() {
            if (document.getElementById('webavatar-jssdk')) return;
            var s = document.createElement('script');
            s.id = 'webavatar-jssdk';
            s.src = './chat-widget.js';
            s.async = true;
            (document.head || document.body).appendChild(s);
        })();
    </script>
